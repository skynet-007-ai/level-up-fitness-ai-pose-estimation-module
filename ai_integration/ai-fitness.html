<!DOCTYPE html>
<html>
<head>
  <title>AI Fitness Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    video { border: 1px solid #ccc; display: block; margin-bottom: 10px; }
    button { margin: 5px; padding: 8px 15px; }
    #results { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>AI Fitness Tracker</h2>

  <video id="video" autoplay muted playsinline width="640" height="480"></video>

  <div>
    <button onclick="startStream()">Start Webcam</button>
    <button onclick="pauseStream()">Pause</button>
    <button onclick="resumeStream()">Resume</button>
    <button onclick="stopAndAnalyze()">Stop & Analyze</button>
    <button onclick="downloadCSV()">Download CSV</button>
  </div>

  <hr>

  <div>
    <label for="uploadVideo">Upload Push-Up Video: </label>
    <input type="file" id="uploadVideo" accept="video/*" />
    <button onclick="uploadAndAnalyze()">Upload & Analyze</button>
  </div>

  <div id="results"></div>

  <script>
    let stream;
    let recorder;
    let chunks = [];

    async function startStream() {
      chunks = [];
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      document.getElementById("video").srcObject = stream;

      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = sendVideo;
      recorder.start();
    }

    function pauseStream() {
      if (recorder && recorder.state === "recording") recorder.pause();
    }

    function resumeStream() {
      if (recorder && recorder.state === "paused") recorder.resume();
    }

    function stopAndAnalyze() {
      if (recorder && recorder.state !== "inactive") recorder.stop();
      if (stream) stream.getTracks().forEach(track => track.stop());
    }

    async function sendVideo() {
      const blob = new Blob(chunks, { type: 'video/mp4' });
      await sendToServer(blob);
    }

    async function uploadAndAnalyze() {
      const fileInput = document.getElementById('uploadVideo');
      if (fileInput.files.length === 0) {
        alert("Please select a video file first.");
        return;
      }
      const file = fileInput.files[0];

      // Show uploaded video in player
      const videoElem = document.getElementById('video');
      videoElem.srcObject = null;
      videoElem.src = URL.createObjectURL(file);
      videoElem.play();

      await sendToServer(file);
    }

    async function sendToServer(videoFile) {
      const form = new FormData();
      form.append("video", videoFile, "session.mp4");

      try {
        const response = await fetch("http://localhost:5001/analyze", {
          method: "POST",
          body: form
        });
        const data = await response.json();
        displayResults(data);
        window.latestResult = data;
      } catch (error) {
        alert("Error sending video to server: " + error);
      }
    }

    function displayResults(data) {
      const resultDiv = document.getElementById('results');
      if (data.error) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
        return;
      }
      resultDiv.innerHTML = `
        <h3>Exercise: ${data.exercise}</h3>
        <p>Total Reps: ${data.reps}</p>
        <h4>Feedback:</h4>
        <ul>${data.feedback.map(f => `<li>${f}</li>`).join('')}</ul>
        <h4>Angles per Rep:</h4>
        <ul>${data.angles.map(a => `<li>Rep ${a.rep} – Min: ${a.min}°, Max: ${a.max}°, Avg: ${a.avg}°</li>`).join('')}</ul>
      `;
    }

    function downloadCSV() {
      const data = window.latestResult;
      if (!data) {
        alert("No data to download yet.");
        return;
      }

      let csv = "Rep,Min Angle,Max Angle,Avg Angle,Feedback\n";
      for (let i = 0; i < data.angles.length; i++) {
        const a = data.angles[i];
        const f = data.feedback[i] || "";
        csv += `${a.rep},${a.min},${a.max},${a.avg},"${f}"\n`;
      }

      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'session_report.csv';
      a.click();
    }
  </script>
</body>
</html>
